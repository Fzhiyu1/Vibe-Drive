# 动态服务 Docker Compose (backend + frontend)
# 配合 docker-compose.stable.yml 使用
services:
  backend:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: java -jar app.jar --spring.config.additional-location=/app/config/
    ports:
      - "8080:8080"
    volumes:
      - ../backend/app.jar:/app/app.jar:ro
      - ../application.yml:/app/config/application.yml:ro
      - ./application-docker.yml:/app/config/application-docker.yml:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    dns:
      - 8.8.8.8
      - 114.114.114.114
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
