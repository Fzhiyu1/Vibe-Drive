# 生产环境 Docker Compose - 使用预构建产物
services:
  backend:
    image: eclipse-temurin:21-jre-alpine
    working_dir: /app
    command: java -jar app.jar --spring.config.additional-location=/app/config/
    ports:
      - "8080:8080"
    volumes:
      - ../backend/app.jar:/app/app.jar:ro
      - ../application.yml:/app/config/application.yml:ro
      - ./application-docker.yml:/app/config/application-docker.yml:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - music-api
    dns:
      - 8.8.8.8
      - 114.114.114.114
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - tts
    restart: unless-stopped

  tts:
    image: node:20-slim
    working_dir: /app
    command: node src/index.js
    ports:
      - "3002:3002"
    volumes:
      - ../tts:/app:ro
    restart: unless-stopped

  music-api:
    image: alpine:latest
    working_dir: /app
    command: ./music-api-linux
    ports:
      - "8081:8081"
    volumes:
      - ../music-api/music-api-linux:/app/music-api-linux:ro
    dns:
      - 8.8.8.8
      - 114.114.114.114
    restart: unless-stopped
